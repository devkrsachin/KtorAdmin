name: Release

on:
  release:
    types: [released, prereleased]

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: KtLint Check
        run: ./gradlew ktlintCheck

      - name: Build
        run: ./gradlew clean build --no-configuration-cache


      # This fork publishes only the core library under io.github.devkrsachin; the Fluent
      # template keeps upstream's namespace (ir.amirroid...), which this fork can't publish to.
      - name: Publish KtorAdminLibrary to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
        run: ./gradlew :KtorAdminLibrary:publishToMavenCentral --no-configuration-cache --stacktrace
